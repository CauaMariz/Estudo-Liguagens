<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello from Electron renderer!</title>

    <style>
      .tittleHome{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      form{
        display: block;
        background-color: rgb(24, 126, 209);
        width: fit-content;
        height: auto;
        min-height: 300px;
        padding: 10px;
        border-radius: 10px;

        input,button{
          display: block;
          padding: 5px;
          border-radius: 6px;
          background-color: aliceblue;
          border: none;
          margin-bottom: 1vw;
        }
        input{
          width: 250px;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="tittleHome">Olá! Bem vindo ao programa de gerar senhas!</h1>
   
    <form method="post" id="form">
      <input type="number" placeholder="Número de caracteres da senha: " required id="qntCrtr">
      <button type="submit">Enviar</button>
    </form>

    <p class="camp"></p>

    <script>
      document.body.addEventListener('submit', (e) => {
        e.preventDefault();
  
        const qntCrtr = document.getElementById('qntCrtr');
        const camp = document.querySelector('.camp');
        const form = document.querySelector('#form');
        // Chama a função exposta no preload.js
        const resultado = window.electron.gerarLetrasAleatorias(Number(qntCrtr.value));
        form.appendChild(camp);
        camp.innerHTML = resultado
      });
    </script>

  </body>
</html>
